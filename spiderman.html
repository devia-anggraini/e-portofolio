<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man Web Camera</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            padding: 25px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .camera-box {
            position: relative;
            width: min(900px, 95vw);
            margin: auto;
            overflow: hidden;
            border-radius: 18px;
            border: 2px solid #444;
            background: #111;
        }

        video {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }

        #status {
            margin: 18px;
            font-size: 18px;
        }

        button {
            padding: 12px 22px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }

        .back {
            background: #333;
            color: white;
        }

        .start {
            background: #e50914;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>🕷️ Spider-Man Web Camera</h1>
    <p>Tunjukkan pose Spider-Man untuk mengeluarkan jaring 🕸️</p>
</header>

<button class="start" onclick="startCamera()">
    📷 Mulai Kamera
</button>

<button class="back" onclick="location.href='index.html'">
    ← Kembali
</button>

<div id="status">
    Kamera belum dimulai
</div>

<div class="camera-box">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<script type="module">

import {
    HandLandmarker,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");

let handLandmarker;
let running = false;

async function setupMediaPipe() {

    const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );

    handLandmarker = await HandLandmarker.createFromOptions(
        vision,
        {
            baseOptions: {
                modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
            },

            runningMode: "VIDEO",
            numHands: 2,
            minHandDetectionConfidence: 0.6,
            minHandPresenceConfidence: 0.6,
            minTrackingConfidence: 0.6
        }
    );
}

window.startCamera = async function () {

    try {

        statusText.textContent =
            "Memuat deteksi tangan...";

        if (!handLandmarker) {
            await setupMediaPipe();
        }

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });

        video.srcObject = stream;

        await video.play();

        running = true;

        statusText.textContent =
            "📷 Kamera aktif — tunjukkan pose Spider-Man!";

        resizeCanvas();

        detectHands();

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "❌ Kamera tidak dapat digunakan. Izinkan akses kamera.";
    }
};

function resizeCanvas() {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
}

video.addEventListener("loadedmetadata", resizeCanvas);

function isSpiderManPose(hand) {

    const indexTip = hand[8];
    const indexPip = hand[6];

    const middleTip = hand[12];
    const middlePip = hand[10];

    const ringTip = hand[16];
    const ringPip = hand[14];

    const pinkyTip = hand[20];
    const pinkyPip = hand[18];

    const indexUp =
        indexTip.y < indexPip.y;

    const pinkyUp =
        pinkyTip.y < pinkyPip.y;

    const middleDown =
        middleTip.y > middlePip.y;

    const ringDown =
        ringTip.y > ringPip.y;

    return (
        indexUp &&
        pinkyUp &&
        middleDown &&
        ringDown
    );
}

function drawWeb(x, y) {

    ctx.save();

    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.shadowBlur = 8;
    ctx.shadowColor = "white";

    const maxLength = 600;

    // Garis jaring
    for (let angle = -90; angle <= 90; angle += 10) {

        const rad =
            angle * Math.PI / 180;

        const endX =
            x + Math.cos(rad) * maxLength;

        const endY =
            y + Math.sin(rad) * maxLength;

        ctx.beginPath();

        ctx.moveTo(x, y);
        ctx.lineTo(endX, endY);

        ctx.stroke();
    }

    // Lingkaran jaring
    for (let radius = 50; radius <= 600; radius += 45) {

        ctx.beginPath();

        for (
            let angle = -90;
            angle <= 90;
            angle += 4
        ) {

            const rad =
                angle * Math.PI / 180;

            const px =
                x + Math.cos(rad) * radius;

            const py =
                y + Math.sin(rad) * radius;

            if (angle === -90) {
                ctx.moveTo(px, py);
            } else {
                ctx.lineTo(px, py);
            }
        }

        ctx.stroke();
    }

    // Titik pusat
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();

    ctx.restore();
}

async function detectHands() {

    if (!running) return;

    if (
        video.readyState >= 2 &&
        handLandmarker
    ) {

        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        const result =
            handLandmarker.detectForVideo(
                video,
                performance.now()
            );

        let spiderDetected = false;

        if (result.landmarks) {

            for (
                const hand of result.landmarks
            ) {

                if (isSpiderManPose(hand)) {

                    spiderDetected = true;

                    const index =
                        hand[8];

                    const x =
                        index.x *
                        canvas.width;

                    const y =
                        index.y *
                        canvas.height;

                    drawWeb(x, y);

                    break;
                }
            }
        }

        if (spiderDetected) {

            statusText.textContent =
                "🕸️ SPIDER WEB AKTIF!";

        } else {

            statusText.textContent =
                "📷 Kamera aktif — tunjukkan pose Spider-Man!";
        }
    }

    requestAnimationFrame(detectHands);
}

</script>

</body>
</html>
