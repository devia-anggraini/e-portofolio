<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blur Gesture</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:Arial,sans-serif;text-align:center}
header{padding:30px 20px 15px}
h1{margin:0 0 10px;font-size:32px}
header p{margin:0;color:#ccc}
.buttons{margin:20px 0}
button{padding:13px 22px;margin:6px;border:0;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.start{background:#e50914;color:#fff}.stop{background:#444;color:#fff}.back{background:#222;color:#fff;border:1px solid #555}
#status{margin:15px auto 20px;color:#ddd;font-size:17px}
.camera-box{position:relative;width:min(900px,95vw);margin:auto;border:2px solid #444;border-radius:18px;overflow:hidden;background:#111}
video{display:block;width:100%;transform:scaleX(-1)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.info{width:min(900px,95vw);margin:20px auto;padding:18px;border:1px solid #333;border-radius:14px;background:#151515}
.info p{color:#ccc;line-height:1.6}
</style>
</head>
<body>
<header>
<h1>😶‍🌫️ Blur Gesture</h1>
<p>Gunakan gesture ✌️ untuk membuat wajah menjadi blur.</p>
</header>

<div class="buttons">
<button class="start" id="startBtn">📷 Mulai Kamera</button>
<button class="stop" id="stopBtn">⛔ Stop Kamera</button>
<button class="back" id="backBtn">← Kembali</button>
</div>

<div id="status">Kamera belum dimulai</div>

<div class="camera-box">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
</div>

<div class="info">
<h2>😶‍🌫️ Cara Menggunakan</h2>
<p>1. Klik <b>📷 Mulai Kamera</b>.</p>
<p>2. Izinkan akses kamera.</p>
<p>3. Buat gesture <b>✌️</b> dengan telunjuk dan jari tengah terbuka.</p>
<p>4. Saat gesture terdeteksi, seluruh tampilan kamera akan dibuat blur.</p>
</div>

<script type="module">
import {
    HandLandmarker,
    FaceDetector,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const statusText=document.getElementById("status");

let handLandmarker=null;
let faceDetector=null;
let stream=null;
let running=false;
let lastTime=-1;

const WASM_URL="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm";
const HAND_MODEL="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const FACE_MODEL="https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite";

async function loadModels(){
    statusText.textContent="🧠 Memuat deteksi tangan dan wajah...";

    const vision=await FilesetResolver.forVisionTasks(WASM_URL);

    handLandmarker=await HandLandmarker.createFromOptions(vision,{
        baseOptions:{modelAssetPath:HAND_MODEL},
        runningMode:"VIDEO",
        numHands:2,
        minHandDetectionConfidence:.45,
        minHandPresenceConfidence:.45,
        minTrackingConfidence:.45
    });

    faceDetector=await FaceDetector.createFromOptions(vision,{
        baseOptions:{modelAssetPath:FACE_MODEL},
        runningMode:"VIDEO",
        minDetectionConfidence:.4
    });
}

async function startCamera(){
    if(running)return;

    try{
        if(!navigator.mediaDevices?.getUserMedia)
            throw new Error("Browser tidak mendukung kamera.");

        statusText.textContent="📷 Membuka kamera...";

        stream=await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"user",
                width:{ideal:1280},
                height:{ideal:720}
            },
            audio:false
        });

        video.srcObject=stream;
        await video.play();
        resizeCanvas();

        running=true;
        lastTime=-1;
        statusText.textContent="🧠 Kamera aktif — memuat deteksi...";

        await loadModels();

        statusText.textContent="✌️ Kamera aktif — buat gesture dua jari!";
        requestAnimationFrame(processFrame);

    }catch(err){
        console.error(err);
        statusText.textContent="❌ Deteksi gagal dimuat.";
        alert("Kamera atau deteksi tidak dapat dimuat.\n\nTekan F12 → Console jika ingin melihat error.");
    }
}

function stopCamera(){
    running=false;
    if(stream){
        stream.getTracks().forEach(t=>t.stop());
        stream=null;
    }
    video.srcObject=null;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    statusText.textContent="⛔ Kamera dihentikan.";
}

function resizeCanvas(){
    if(video.videoWidth&&video.videoHeight){
        canvas.width=video.videoWidth;
        canvas.height=video.videoHeight;
    }
}
video.addEventListener("loadedmetadata",resizeCanvas);
window.addEventListener("resize",resizeCanvas);

function dist(a,b){
    return Math.hypot(a.x-b.x,a.y-b.y);
}

function extended(tip,pip,mcp){
    return dist(tip,mcp)>dist(pip,mcp)*1.10;
}

function folded(tip,pip,mcp){
    return dist(tip,mcp)<dist(pip,mcp)*1.12;
}

function isTwoFingerGesture(hand){
    if(!hand||hand.length<21)return false;

    const index=extended(hand[8],hand[6],hand[5]);
    const middle=extended(hand[12],hand[10],hand[9]);
    const ring=folded(hand[16],hand[14],hand[13]);
    const pinky=folded(hand[20],hand[18],hand[17]);

    return index&&middle&&ring&&pinky;
}

function getBox(face){
    const b=face.boundingBox;
    if(!b)return null;

    return {
        x:b.originX,
        y:b.originY,
        w:b.width,
        h:b.height
    };
}

function blurFace(box){
    const padX=box.w*.15;
    const padY=box.h*.18;

    const x=Math.max(0,box.x-padX);
    const y=Math.max(0,box.y-padY);
    const w=Math.min(canvas.width-x,box.w+padX*2);
    const h=Math.min(canvas.height-y,box.h+padY*2);

    // Ambil bagian wajah dari video.
    const temp=document.createElement("canvas");
    temp.width=Math.max(1,Math.floor(w));
    temp.height=Math.max(1,Math.floor(h));

    const tctx=temp.getContext("2d");
    tctx.translate(temp.width,0);
    tctx.scale(-1,1);

    // Video di canvas terlihat mirror; koordinat wajah dibalik.
    const sx=canvas.width-(x+w);
    tctx.drawImage(video,sx,y,w,h,0,0,temp.width,temp.height);

    ctx.save();
    ctx.filter="blur(22px)";
    ctx.drawImage(temp,x,y,w,h);
    ctx.restore();

    // Tutup tepi blur supaya tidak ada garis kotak keras.
    ctx.save();
    ctx.globalCompositeOperation="destination-out";
    const grad=ctx.createRadialGradient(
        x+w/2,y+h/2,Math.min(w,h)*.20,
        x+w/2,y+h/2,Math.max(w,h)*.58
    );
    grad.addColorStop(0,"rgba(0,0,0,1)");
    grad.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=grad;
    ctx.fillRect(x,y,w,h);
    ctx.restore();
}

function processFrame(){
    if(!running||!handLandmarker||!faceDetector)return;

    if(video.readyState>=2&&video.currentTime!==lastTime){
        resizeCanvas();

        try{
            const hands=handLandmarker.detectForVideo(video,performance.now());

            let active=false;
            for(const hand of (hands.landmarks||[])){
                if(isTwoFingerGesture(hand)){
                    active=true;
                    break;
                }
            }

            // Tampilkan seluruh kamera sebagai dasar.
            // Kalau gesture ✌️ aktif, seluruh tampilan kamera diblur,
            // bukan hanya wajah.
            ctx.save();
            ctx.translate(canvas.width,0);
            ctx.scale(-1,1);

            if(active){
                ctx.filter="blur(18px)";
                ctx.drawImage(
                    video,
                    -10,-10,
                    canvas.width+20,
                    canvas.height+20
                );
            }else{
                ctx.filter="none";
                ctx.drawImage(
                    video,
                    0,0,
                    canvas.width,
                    canvas.height
                );
            }

            ctx.restore();

            if(active){
                statusText.textContent="😶‍🌫️ BLUR AKTIF — SELURUH LAYAR DIBLUR!";
            }else{
                statusText.textContent="✌️ Kamera aktif — buat gesture dua jari!";
            }

            lastTime=video.currentTime;

        }catch(err){
            console.error("Detection error:",err);
        }
    }

    requestAnimationFrame(processFrame);
}

startBtn.addEventListener("click",startCamera);
stopBtn.addEventListener("click",stopCamera);
backBtn.addEventListener("click",()=>location.href="index.html");
window.addEventListener("beforeunload",stopCamera);
</script>
</body>
</html>
